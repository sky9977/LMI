<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGAPX – Close the skill gap. Land the job.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7fb;--card:#fff;--fg:#14142b;--mut:#5b5b78;--bd:#e6e6f0;--ac:#5b4bff;--ac2:#eeecff;--tl:#0f9d8a;--tl2:#dcf5f1;--am:#b45309;--rd:#d92d4a;--sh:0 4px 24px rgba(40,30,120,.08);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d1a;--card:#171728;--fg:#f1f1fa;--mut:#a3a3c2;--bd:#2a2a42;--ac:#8b7dff;--ac2:#25214d;--tl:#2dd4bf;--tl2:#0f3a36;--am:#fbbf24;--rd:#ff6b81;--sh:0 4px 24px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{--bg:#0d0d1a;--card:#171728;--fg:#f1f1fa;--mut:#a3a3c2;--bd:#2a2a42;--ac:#8b7dff;--ac2:#25214d;--tl:#2dd4bf;--tl2:#0f3a36;--am:#fbbf24;--rd:#ff6b81;--sh:0 4px 24px rgba(0,0,0,.4);}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:16px/1.55 Inter,system-ui,sans-serif;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.08;font-weight:800;letter-spacing:-.03em}
h2{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}h3{font-weight:600}
.mut{color:var(--mut)}.sm{font-size:.875rem}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.card.h:hover{transform:translateY(-4px)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:10px 20px;border-radius:12px;font:600 .95rem Inter;cursor:pointer;transition:transform .15s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--ac2);color:var(--ac)}
.pill.g{background:var(--tl2);color:var(--tl)}.pill.a{background:rgba(245,158,11,.15);color:var(--am)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--bd)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:64px}.sp{flex:1}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.04em}.logo b{color:var(--ac)}
.nl{display:none;gap:20px}@media(min-width:800px){.nl{display:flex}}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:1.1rem;color:var(--fg)}
.hero{padding:72px 0 40px;text-align:center}.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--tl));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:600px;margin:20px auto 32px}
.big{font-size:2.4rem;font-weight:800;color:var(--ac)}
.sec{padding:48px 0}
.step{display:flex;gap:16px;align-items:flex-start}.num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;margin:6px 0 16px}
label{font-weight:600;font-size:.85rem}
.app{display:flex;min-height:100vh}
.side{display:none;width:240px;flex:none;padding:24px 16px;border-right:1px solid var(--bd);background:var(--card);position:sticky;top:0;height:100vh}
.side a{display:flex;gap:12px;padding:10px 14px;border-radius:12px;color:var(--mut);font-weight:500;margin-bottom:4px;transition:.2s}
.side a:hover,.side a.on,.tab a.on{background:var(--ac2);color:var(--ac)}
.main{flex:1;padding:24px 20px 96px;min-width:0;max-width:1100px}
.tab{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.tab a{padding:6px 10px;border-radius:10px;text-align:center;font-size:.7rem;color:var(--mut)}
@media(min-width:900px){.side{display:block}.tab{display:none}.main{padding:32px 40px}}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--tl));width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.rng{stroke:var(--tl);stroke-linecap:round;fill:none;stroke-width:10;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.trk{stroke:var(--bd);fill:none;stroke-width:10}
.page{animation:in .45s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(14px)}}
.sel{cursor:pointer;border:2px solid var(--bd)}.sel.on{border-color:var(--ac);background:var(--ac2)}
.node{display:flex;gap:16px;align-items:center;padding:16px 0;position:relative}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;border:2px solid var(--bd);background:var(--card)}
.dot.d{background:var(--tl);border-color:var(--tl);color:#fff}.dot.c{border-color:var(--ac);color:var(--ac);animation:pu 2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 8px var(--ac2)}}
.toasts{position:fixed;right:16px;bottom:88px;display:grid;gap:8px;z-index:50}
.toast{background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;box-shadow:var(--sh);animation:in .3s}
.row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--bd)}.row.me{background:var(--ac2);border-radius:12px}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:16px 0}.pod div{flex:1;max-width:140px;text-align:center;border-radius:14px 14px 0 0;background:var(--ac2);padding:12px 4px;font-weight:700}
.chat{position:fixed;right:16px;bottom:88px;z-index:30}
@media(min-width:900px){.chat{bottom:24px}.toasts{bottom:88px}}
.fab{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:1.4rem;cursor:pointer;box-shadow:var(--sh)}
.cp{position:absolute;right:0;bottom:70px;width:300px;display:none}.cp.o{display:block;animation:in .3s}
code.t{font:700 1.3rem ui-monospace,monospace;background:var(--ac2);color:var(--ac);padding:8px 14px;border-radius:10px}
.sk{background:linear-gradient(90deg,var(--bd),var(--ac2),var(--bd));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px;height:80px}@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
const S={fit:72,pts:2840,rank:42,tech:'AGX-2026-48213',sel:['ai'],reg:'India',theme:null,chat:false};
const C=[['ai','🧠','AI / ML / GenAI','Very high','₹12–35L','6 mo','Hard'],['ds','📊','Data Science & Eng.','Very high','₹8–28L','5 mo','Medium'],['sec','🛡️','Cybersecurity','High','₹7–30L','6 mo','Hard'],['cl','☁️','Cloud Computing','Very high','₹9–32L','4 mo','Medium'],['dev','⚙️','DevOps / SRE','High','₹9–30L','4 mo','Medium'],['fs','💻','Full-Stack Dev','High','₹6–28L','5 mo','Medium'],['web3','⛓️','Blockchain & Web3','Medium','₹8–35L','4 mo','Hard'],['iot','🤖','Robotics & IoT','Medium','₹6–22L','6 mo','Hard'],['pm','🧭','Product & UX','High','₹8–30L','3 mo','Easy']];
const SK=[['Python',86,90],['SQL',78,88],['ML',64,92],['Cloud',48,80],['MLOps',32,74],['System design',52,78]];
const $=(s)=>document.querySelector(s);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),2800)}
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t}
function toggleTheme(){const dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;setTheme(dark?'light':'dark')}
const ring=(v,s=120,l='')=>`<svg width="${s}" height="${s}" viewBox="0 0 120 120" role="img" aria-label="${l} ${v}%"><circle class="trk" cx="60" cy="60" r="50"/><circle class="rng" cx="60" cy="60" r="50" transform="rotate(-90 60 60)" stroke-dasharray="314" stroke-dashoffset="314" data-ring="${v}"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="800" fill="var(--fg)">${v}</text></svg>`;
function radar(){const n=SK.length,c=130,r=95,pt=(i,v)=>{const a=Math.PI*2*i/n-Math.PI/2;return[c+Math.cos(a)*r*v/100,c+Math.sin(a)*r*v/100]};
const poly=k=>SK.map((s,i)=>pt(i,s[k]).join(',')).join(' ');
const g=[25,50,75,100].map(v=>`<polygon points="${SK.map((s,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--bd)"/>`).join('');
const lb=SK.map((s,i)=>{const[x,y]=pt(i,118);return`<text x="${x}" y="${y}" font-size="10" text-anchor="middle" fill="var(--mut)">${s[0]}</text>`}).join('');
return`<svg viewBox="0 0 260 260" style="max-width:340px;width:100%" role="img" aria-label="Skill vs market radar">${g}<polygon points="${poly(2)}" fill="rgba(217,45,74,.1)" stroke="var(--rd)" stroke-dasharray="4"/><polygon points="${poly(1)}" fill="var(--ac)" fill-opacity=".25" stroke="var(--ac)" stroke-width="2"/>${lb}</svg>`}
const nav=(l,r)=>`<a href="#${r}">${l}</a>`;
function pubNav(){return`<header class="nav"><div class="wrap"><a class="logo" href="#/">AGAP<b>X</b></a><nav class="nl" aria-label="Main">${nav('Courses','/courses')}${nav('Events','/dashboard')}${nav('For Companies','/dashboard')}</nav><span class="sp"></span>${nav('Login','/signup')}<a class="btn p" href="#/signup">Sign up</a><button class="ib" onclick="toggleTheme()" aria-label="Toggle theme">◐</button></div></header>`}
const T=[['/dashboard','🏠','Home'],['/courses','📚','Courses'],['/roadmap','🗺️','Roadmap'],['/fit','📈','Market fit'],['/tasks','✅','Tasks'],['/board','🏆','Ranks']];
function shell(h,p){return`<div class="app"><aside class="side"><a class="logo" href="#/" style="padding:0 14px 24px;color:var(--fg)">AGAP<b>X</b></a>${T.map(t=>`<a href="#${t[0]}" class="${p===t[0]?'on':''}">${t[1]} ${t[2]}</a>`).join('')}<div style="position:absolute;bottom:24px;left:16px;right:16px"><button class="btn" style="width:100%;justify-content:center" onclick="toggleTheme()">◐ Light / Dark</button></div></aside><main class="main page">${h}</main></div><nav class="tab" aria-label="Learner">${T.map(t=>`<a href="#${t[0]}" class="${p===t[0]?'on':''}"><div style="font-size:1.2rem">${t[1]}</div>${t[2]}</a>`).join('')}</nav>
<div class="chat"><div class="cp card" id="cp"><b>AI Mentor</b> <span class="pill g">Guide me, don't solve it</span><p class="sm mut" style="margin:12px 0">You've been on recursion for 40 mins. Want a hint, or revisit base cases first?</p><button class="btn sm" onclick="toast('Hint: what stops the recursion?')">Give a hint</button> <button class="btn sm" onclick="toast('Roadmap update accepted')">Accept roadmap tweak</button></div><button class="fab" onclick="$('#cp').classList.toggle('o')" aria-label="Open AI mentor">💬</button></div>`}
const stat=(n,l,s='')=>`<div class="card"><div class="big"><span data-count="${n}">0</span>${s}</div><p class="mut sm">${l}</p></div>`;
const V={
'/':()=>pubNav()+`<section class="hero wrap page"><span class="pill">Learn · Prove · Get hired</span><h1 style="margin-top:16px">Close the skill gap.<br><span>Land the job.</span></h1><p class="mut">AGAPX helps unemployed, underskilled and career-switching people master in-demand tech skills, prove them on real-world problems, and get approached by companies.</p><a class="btn p" href="#/signup">Get started →</a> <a class="btn" href="#/dashboard">For companies</a></section>
<section class="wrap grid g3">${stat(87,'of employers report a tech skills gap','%')}${stat(11,'million tech roles unfilled by 2030','M')}${stat(3,'avg. months to first offer','x')}</section>
<section class="wrap sec"><h2>How it works</h2><div class="grid g3" style="margin-top:20px">${['Sign up & get your Tech ID','Pick up to 3 courses','Placement test or start fresh','Solve real-world tasks with mentors','Get approached by companies'].map((t,i)=>`<div class="card h step"><div class="num">${i+1}</div><b>${t}</b></div>`).join('')}</div></section>
<section class="wrap sec"><h2>Popular tracks</h2><div class="grid g3" style="margin-top:20px">${C.slice(0,6).map(c=>`<a href="#/courses" class="card h"><div style="font-size:2rem">${c[1]}</div><h3>${c[2]}</h3><p class="mut sm">${c[4]} · ${c[5]}</p></a>`).join('')}</div></section>
<section class="wrap sec"><h2>Success stories</h2><div class="grid g2" style="margin-top:20px"><div class="card">“I went from retail to Cloud Engineer in 5 months.” <p class="mut sm" style="margin-top:12px">— Meera R., hired at Nimbus Labs</p></div><div class="card">“Real-world tasks proved my skills better than a résumé.” <p class="mut sm" style="margin-top:12px">— Arjun K., hired at Quanta Pay</p></div></div></section>
<footer class="wrap sec mut sm">© 2026 AGAPX · Prototype with mock data</footer>`,
'/signup':()=>pubNav()+`<div class="wrap page" style="max-width:460px;padding-top:40px"><div class="card"><h2>Create your account</h2><p class="mut sm" style="margin:8px 0 20px">Free to start. Low-bandwidth mode available.</p><form onsubmit="event.preventDefault();toast('Account created!');location.hash='/welcome'"><label for="n">Full name</label><input id="n" required value="Priya Nair"><label for="e">Email</label><input id="e" type="email" required value="priya@mail.com"><label for="p">Password</label><input id="p" type="password" required oninput="pw(this.value)"><div class="bar" style="margin:-8px 0 16px"><i id="pm"></i></div><label for="s">Current status</label><select id="s"><option>Unemployed</option><option>Student</option><option>Working</option><option>Career switcher</option></select><label style="display:flex;gap:8px"><input type="checkbox" required style="width:auto;margin:0"> I agree to the terms</label><br><button class="btn p" style="width:100%;justify-content:center">Continue</button></form></div></div>`,
'/welcome':()=>pubNav()+`<div class="wrap page" style="max-width:520px;padding-top:40px"><div class="card" style="text-align:center"><div style="font-size:3rem">🎉</div><h2>Welcome to AGAPX!</h2><p class="mut sm" style="margin:8px 0 20px">Log in with your Tech ID or email + password.</p><p class="sm mut">Your Tech ID</p><code class="t">${S.tech}</code> <button class="btn sm" onclick="toast('Tech ID copied')">Copy</button><p class="sm mut" style="margin-top:20px">Auto-generated password</p><code class="t">Kx7#mQ2v!Lp9</code> <button class="btn sm" onclick="toast('Password copied')">Copy</button><br><br><a class="btn p" href="#/courses">Choose your courses →</a></div></div>`,
'/courses':()=>shell(`<h2>Choose your courses</h2><p class="mut">Pick up to 3 · <b id="cn">${S.sel.length}</b>/3 selected</p><input placeholder="Search courses…" oninput="fc(this.value)" aria-label="Search courses" style="margin-top:16px"><div class="grid g3" id="cg">${C.map(cc).join('')}</div><br><a class="btn p" href="#/roadmap">Build my roadmap →</a>`,'/courses'),
'/roadmap':()=>shell(`<h2>Your AI/ML roadmap</h2><p class="mut">Placement test: <b>Intermediate</b> start · 18 weeks · 8 hrs/week</p><div class="card" style="margin:20px 0"><div class="bar"><i data-w="38"></i></div><p class="sm mut" style="margin-top:8px">38% complete</p></div><div class="card">${[['Python for ML','Done',2],['Statistics & Linear Algebra','Done',3],['Supervised Learning','You start here',4],['Deep Learning','Locked',4],['LLM Apps & RAG','Locked',3],['MLOps Capstone','Locked',2]].map((m,i)=>`<div class="node"><div class="dot ${i<2?'d':i==2?'c':''}">${i<2?'✓':i==2?'▶':'🔒'}</div><div style="flex:1"><b>${m[0]}</b><div class="sm mut">${m[2]} weeks · lessons · practice · mini project</div></div>${i==2?'<span class="pill">You are here</span>':''}</div>`).join('')}</div><br><button class="btn" onclick="toast('Weekly hours updated')">Adjust hours/week</button>`,'/roadmap'),
'/fit':()=>shell(`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h2 style="flex:1">Market Fit</h2><button class="btn" onclick="S.reg=S.reg=='India'?'Global':'India';go()">Region: ${S.reg}</button></div><div class="grid g2" style="margin-top:20px"><div class="card" style="text-align:center"><h3>Market Fit Score</h3>${ring(S.reg=='India'?S.fit:66,160,'Market fit')}<p class="sm mut">Estimated salary ₹${S.reg=='India'?'11–18L':'$70–105k'}</p></div><div class="card" style="text-align:center"><h3>You vs market</h3>${radar()}<p class="sm mut"><span style="color:var(--ac)">■</span> You <span style="color:var(--rd)">▪▪</span> Demand</p></div></div><div class="card" style="margin-top:16px"><h3>Skill gaps</h3>${SK.map(s=>`<div style="margin:14px 0"><div class="sm" style="display:flex;justify-content:space-between"><span>${s[0]}</span><span class="pill ${s[2]-s[1]>30?'':'a'}" style="${s[2]-s[1]>30?'background:rgba(217,45,74,.15);color:var(--rd)':''}">gap ${s[2]-s[1]}</span></div><div class="bar"><i data-w="${s[1]}"></i></div></div>`).join('')}<button class="btn p" onclick="S.fit=Math.min(99,S.fit+3);go();toast('Fit score up! Learn MLOps next')">Simulate completing a task</button></div><div class="grid g3" style="margin-top:16px">${[['ML Engineer',78],['Data Scientist',74],['AI App Developer',69]].map(r=>`<div class="card h"><h3>${r[0]}</h3><span class="pill g">${r[1]}% match</span></div>`).join('')}</div>`,'/fit'),
'/dashboard':()=>shell(`<h2>Hi Priya 👋</h2><p class="mut">Tech ID <b>${S.tech}</b> · 🔥 12-day streak</p><div class="grid g3" style="margin:20px 0">${stat(S.pts,'Points')}${stat(S.rank,'Global rank','')}<div class="card" style="text-align:center">${ring(S.fit,110,'Market fit')}<p class="sm mut">Market Fit</p></div></div><div class="grid g2"><div class="card"><h3>Today's tasks</h3><p class="sm mut">3 remaining</p><a class="btn" style="margin-top:12px" href="#/tasks">Open tasks</a></div><div class="card"><h3>AI mentor summary</h3><p class="sm mut">Strong on SQL. Weak spot: recursion. Suggested focus: tree traversal problems.</p></div><div class="card"><h3>New approaches</h3><p class="sm mut">Nimbus Labs · ML Engineer · 78% match · ₹14–18L</p><button class="btn sm" style="margin-top:8px" onclick="toast('Approach accepted')">Accept</button> <button class="btn sm" onclick="toast('Declined')">Decline</button></div><div class="card"><h3>Activity</h3><div style="display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:8px">${Array.from({length:100},(_,i)=>`<i style="aspect-ratio:1;border-radius:3px;background:var(--tl);opacity:${[.12,.3,.6,1][(i*7+i%5)%4]}"></i>`).join('')}</div></div></div>`,'/dashboard'),
'/tasks':()=>shell(`<h2>Real-world tasks</h2><div class="grid g2" style="margin-top:16px">${[['Daily','Two-sum variants','+40 pts'],['Weekly','Design a notification system','+180 pts'],['Real-world case','Optimize a slow SQL query for an e-commerce site','+120 pts']].map((t,i)=>`<div class="card h"><span class="pill ${i?'g':''}">${t[0]}</span><h3 style="margin:8px 0">${t[1]}</h3><p class="sm mut">${t[2]}</p><button class="btn p sm" style="margin-top:12px" onclick="openT()">Open</button></div>`).join('')}</div><div class="card" id="td" style="display:none;margin-top:16px"><h3>Optimize a slow SQL query</h3><p class="sm mut">Orders page takes 9s. Constraint: no schema downtime.</p><textarea style="width:100%;height:100px;margin:12px 0;border-radius:12px;padding:12px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);font-family:ui-monospace,monospace">SELECT * FROM orders o JOIN users u ON ...</textarea><button class="btn" onclick="toast('Hint used (−10 pts): check indexes')">Hint (−10)</button> <button class="btn p" onclick="sub()">Submit</button><div id="fb"></div></div>`,'/tasks'),
'/board':()=>shell(`<h2>Leaderboard</h2><div class="pod"><div style="height:100px">🥈<br>Rohan<br>3,410</div><div style="height:140px">🥇<br>Ananya<br>3,980</div><div style="height:80px">🥉<br>Sam<br>3,120</div></div><div class="card">${[[4,'Diya M.',3050],[5,'Kabir S.',2990],[41,'Leo P.',2851],[42,'Priya N. (you)',S.pts],[43,'Isha T.',2812]].map(r=>`<div class="row ${r[0]==42?'me':''}"><b style="width:32px">#${r[0]}</b><span style="flex:1">${r[1]}</span><span class="pill">Gold</span><b>${r[2].toLocaleString()}</b></div>`).join('')}</div>`,'/board')};
const cc=c=>`<div class="card sel h ${S.sel.includes(c[0])?'on':''}" tabindex="0" role="button" aria-pressed="${S.sel.includes(c[0])}" onclick="pick('${c[0]}')" onkeydown="if(event.key=='Enter')pick('${c[0]}')" data-n="${c[2].toLowerCase()}"><div style="font-size:2rem">${c[1]}</div><h3>${c[2]}</h3><div style="margin:8px 0;display:flex;gap:6px;flex-wrap:wrap"><span class="pill g">Demand: ${c[3]}</span><span class="pill">${c[6]}</span></div><p class="sm mut">${c[4]} · ${c[5]}</p></div>`;
function pick(id){const i=S.sel.indexOf(id);if(i>-1)S.sel.splice(i,1);else if(S.sel.length<3)S.sel.push(id);else toast('Max 3 courses');$('#cg').innerHTML=C.map(cc).join('');$('#cn').textContent=S.sel.length}
function fc(q){document.querySelectorAll('#cg .card').forEach(e=>e.style.display=e.dataset.n.includes(q.toLowerCase())?'':'none')}
function pw(v){const s=[/.{8}/,/[A-Z]/,/\d/,/\W/].filter(r=>r.test(v)).length;$('#pm').style.width=s*25+'%'}
function openT(){$('#td').style.display='block';$('#td').scrollIntoView({behavior:'smooth'})}
function sub(){S.pts+=95;S.fit=Math.min(99,S.fit+1);$('#fb').innerHTML=`<div style="margin-top:16px"><h3>Points breakdown · +95</h3>${[['Correctness',30,35],['Approach',22,25],['Efficiency',15,20],['Communication',10,10],['Real-world thinking',18,20]].map(r=>`<div class="sm" style="margin-top:8px">${r[0]} ${r[1]}/${r[2]}</div><div class="bar"><i data-w="${r[1]/r[2]*100}"></i></div>`).join('')}</div>`;anim();toast('+95 points! Fit score updated')}
function anim(){requestAnimationFrame(()=>setTimeout(()=>{document.querySelectorAll('[data-ring]').forEach(e=>e.style.strokeDashoffset=314*(1-e.dataset.ring/100));document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');document.querySelectorAll('[data-count]').forEach(e=>{const to=+e.dataset.count,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1200);e.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString();if(p<1)requestAnimationFrame(f)})(t0)})},40))}
function go(){const r=location.hash.slice(1)||'/';const v=V[r]||V['/'];$('#root').innerHTML=v();if(!$('#root .page'))$('#root').firstElementChild.classList.add('page');anim();scrollTo(0,0)}
addEventListener('hashchange',go);go();
</script>
</body>
</html>
